# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.10/yaml.schema.json
version: v1.10
environmentFolderPath: ./env

# Microsoft 365 registration only; the MCP server is already deployed.
# The caldova environment retains this plugin's manifest ID in the new tenant.
provision:
  - uses: teamsApp/create
    with:
      name: Coupa Procurement
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./manifest.json
      outputZipPath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./build
  # Preserve source archives, but exclude unsupported nested ZIPs from upload.
  - uses: script
    with:
      run: pwsh -NoProfile -File ../../prepare_atk_package.ps1 -PackagePath ./build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/update
    with:
      appPackagePath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
      shareLink: SHARE_LINK

publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./manifest.json
      outputZipPath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./build
  - uses: script
    with:
      run: pwsh -NoProfile -File ../../prepare_atk_package.ps1 -PackagePath ./build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/update
    with:
      appPackagePath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
projectId: 1ea74b78-be14-4423-8c81-1b45032761b7
